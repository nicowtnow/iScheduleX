<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFl5eVSx1NSJPpDlSxbHIxjzT18nXyTmI",
            authDomain: "ischedule-46846.firebaseapp.com",
            projectId: "ischedule-46846",
            storageBucket: "ischedule-46846.firebasestorage.app",
            messagingSenderId: "629536000069",
            appId: "1:629536000069:web:2330e6f33d4cf4821c3b2c",
            measurementId: "G-T3PFG3BCVJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "schedules", "postit_user_v3");

        window.saveDataToCloud = async function(data) {
            try {
                await setDoc(docRef, data);
            } catch (e) {
                console.error("Error al guardar en Firebase:", e);
            }
        };

        window.initRealtimeSync = function(callback) {
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    callback(docSnap.data());
                }
            }, (error) => {
                console.error("Error en tiempo real:", error);
            });
        };
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        :root {
            --theme-primary: #007aff;
            --theme-gradient: linear-gradient(to bottom, #007aff, #0056b3);
            --theme-header: linear-gradient(to bottom, #d4d4d4 0%, #b5b5b5 50%, #8c8c8c 51%, #a6a6a6 100%);
        }

        body.theme-green {
            --theme-primary: #28a745;
            --theme-gradient: linear-gradient(to bottom, #28a745, #1e7e34);
            --theme-header: linear-gradient(to bottom, #d4f0d8 0%, #b5e2be 50%, #8cc297 51%, #a3d2ad 100%);
        }

        body.theme-pink {
            --theme-primary: #e83e8c;
            --theme-gradient: linear-gradient(to bottom, #e83e8c, #c81e70);

        .aqua-btn {

    <script>
        const defaultData = {
            updatedAt: 0,
            theme: 'blue',
            subjects: [
                { id: "s1", name: "POE I", salon: "Salón 4", notebook: "" },
                { id: "s2", name: "Filosofía I", salon: "Salón 2", notebook: "" },
                { id: "s3", name: "Computación I", salon: "Lab Cómputo", notebook: "" },
                { id: "s4", name: "Matemáticas I", salon: "Usos Múltiples", notebook: "" },
                { id: "s5", name: "Física I", salon: "Salón 5", notebook: "" },
                { id: "s6", name: "Química I", salon: "Lab Química", notebook: "" }
            ],
            notes: []
        };

        let localData = JSON.parse(localStorage.getItem('ischedule_x_data')) || defaultData;
        let activeNotebookId = null;
        let isSyncingFromCloud = false;

        // Firebase Sync
        window.addEventListener('firebase-ready', () => {
            window.initRealtimeSync((cloudData) => {
                if (!cloudData) return;
                const cloudTime = cloudData.updatedAt || 0;
                const localTime = localData.updatedAt || 0;

                if (cloudTime > localTime) {
                    isSyncingFromCloud = true;
                    localData = cloudData;
                    localStorage.setItem('ischedule_x_data', JSON.stringify(localData));
                    applyTheme(localData.theme || 'blue');
                    renderAll();
                    isSyncingFromCloud = false;
                } else if (localTime > cloudTime && cloudTime === 0) {
                    window.saveDataToCloud(localData);
                }
            });
        });

        function saveAndSync() {
            if (isSyncingFromCloud) return;
            localData.updatedAt = Date.now();
            localStorage.setItem('ischedule_x_data', JSON.stringify(localData));
            if (window.saveDataToCloud) {
                window.saveDataToCloud(localData);
            }
            renderAll();
        }

        function setTheme(themeName) {
            localData.theme = themeName;
            applyTheme(themeName);
            saveAndSync();
        }

        function applyTheme(themeName) {
            document.body.className = `theme-${themeName}`;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.getElementById('view-notebook').classList.remove('active');
            document.querySelectorAll('.dock-tab').forEach(t => t.classList.remove('active'));

            if (tabName === 'schedule') {
                document.getElementById('view-schedule').classList.add('active');
                document.getElementById('dock-btn-schedule').classList.add('active');
                document.getElementById('header-title').innerText = 'i$chedule X';
            } else if (tabName === 'notes') {
                document.getElementById('view-notes').classList.add('active');
                document.getElementById('dock-btn-notes').classList.add('active');
                document.getElementById('header-title').innerText = 'Pizarra de Notas';
            } else if (tabName === 'settings') {
                document.getElementById('view-settings').classList.add('active');
                document.getElementById('dock-btn-settings').classList.add('active');
                document.getElementById('header-title').innerText = 'Ajustes y Extras';
                initMinesweeper();
            } else if (tabName === 'notebook') {
                document.getElementById('view-notebook').classList.add('active');
            }
        }

        function renderAll() {
            renderSchedule();
            renderNotes();
            renderSettingsSubjects();
            applyTheme(localData.theme || 'blue');
        }

        function renderSchedule() {
            const container = document.getElementById('grid-container');
            container.innerHTML = "";
            localData.subjects.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.onclick = () => openNotebook(sub.id);
                card.innerHTML = `
                    <div>
                        <h3 style="margin:0; font-size:14px; font-weight:bold;">${sub.name}</h3>
                        <span style="font-size:11px; background:rgba(0,0,0,0.06); padding:2px 6px; border-radius:4px; margin-top:4px; display:inline-block;">${sub.salon}</span>
                    </div>
                    <div style="font-size:10px; color:var(--theme-primary); font-weight:bold; border-top:1px dashed rgba(0,0,0,0.15); padding-top:4px; margin-top:4px;">📖 Abrir Cuaderno</div>
                `;
                container.appendChild(card);
            });
        }

        // Reloj de Clase Dinámico (Calcula bloques simulados de 50 minutos)
        function updateClassClock() {
            const now = new Date();
            const minutesTotal = now.getHours() * 60 + now.getMinutes();
            // Supongamos bloques de clase de 50 min desde las 7:00 AM
            const schoolStart = 7 * 60;
            const classDuration = 50;
            const breakDuration = 10;
            const totalBlock = classDuration + breakDuration;

            if (minutesTotal < schoolStart || minutesTotal > 15 * 60) {
                document.getElementById('class-status-text').innerText = "Fuera de horario escolar";
                document.getElementById('class-countdown-timer').innerText = "00:00";
                return;
            }

            const elapsedToday = minutesTotal - schoolStart;
            const currentBlockIndex = Math.floor(elapsedToday / totalBlock);
            const timeInBlock = elapsedToday % totalBlock;

            if (timeInBlock < classDuration) {
                const minsLeft = classDuration - timeInBlock;
                const secsLeft = 59 - now.getSeconds();
                document.getElementById('class-status-text').innerText = `Clase activa (#${currentBlockIndex + 1})`;
                document.getElementById('class-countdown-timer').innerText = `${String(minsLeft).padStart(2,'0')}:${String(secsLeft).padStart(2,'0')}`;
            } else {
                document.getElementById('class-status-text').innerText = "¡RecESO / Cambio de clase!";
                document.getElementById('class-countdown-timer').innerText = "LIBRE";
            }
        }
        setInterval(updateClassClock, 1000);

        // Cuaderno por Materia
        function openNotebook(subjectId) {
            const sub = localData.subjects.find(s => s.id === subjectId);
            if (!sub) return;
            activeNotebookId = subjectId;
            document.getElementById('notebook-title').innerText = sub.name;
            document.getElementById('notebook-textarea').value = sub.notebook || '';
            switchTab('notebook');
        }

        function saveNotebookContent() {
            if (!activeNotebookId) return;
            const sub = localData.subjects.find(s => s.id === activeNotebookId);
            if (sub) {
                sub.notebook = document.getElementById('notebook-textarea').value;
                saveAndSync();
                alert("¡Apuntes guardados en la nube!");
            }
        }

        // Ajustes y Materias
        function renderSettingsSubjects() {
            const list = document.getElementById('subjects-manage-list');
            list.innerHTML = "";
            const addBtn = document.getElementById('add-subject-btn');
            const nameInput = document.getElementById('new-subject-name');
            const salonInput = document.getElementById('new-subject-salon');

            if (localData.subjects.length >= 20) {
                addBtn.disabled = true;
                nameInput.placeholder = "Límite de 20 alcanzado";
                nameInput.disabled = true;
                salonInput.disabled = true;
            } else {
                addBtn.disabled = false;
                nameInput.placeholder = "Materia...";
                nameInput.disabled = false;
                salonInput.disabled = false;
            }

            localData.subjects.forEach((sub, index) => {
                const row = document.createElement('div');
                row.className = 'subject-manage-row';
                row.innerHTML = `
                    <div style="display:flex; gap:6px; flex:1; align-items:center;">
                        <input type="text" value="${sub.name}" id="sub-name-${index}" style="padding:4px; border:1px solid #ddd; border-radius:4px; font-size:12px; width:100px;">
                        <input type="text" value="${sub.salon}" id="sub-salon-${index}" style="padding:4px; border:1px solid #ddd; border-radius:4px; font-size:12px; width:70px;">
                        <button class="aqua-btn" onclick="updateSubject(${index})">Guardar</button>
                    </div>
                    <button class="aqua-btn danger" onclick="deleteSubject(${index})">Borrar</button>
                `;
                list.appendChild(row);
            });
        }

        function addNewSubject() {
            if (localData.subjects.length >= 20) return;
            const name = document.getElementById('new-subject-name').value.trim();
            const salon = document.getElementById('new-subject-salon').value.trim();
            if (!name) return;

            localData.subjects.push({ id: 's_' + Date.now(), name: name, salon: salon || 'Salón', notebook: '' });
            document.getElementById('new-subject-name').value = '';
            document.getElementById('new-subject-salon').value = '';
            saveAndSync();
        }

        function updateSubject(index) {
            const newName = document.getElementById(`sub-name-${index}`).value.trim();
            const newSalon = document.getElementById(`sub-salon-${index}`).value.trim();
            if (newName) {
                localData.subjects[index].name = newName;
                localData.subjects[index].salon = newSalon;
                saveAndSync();
                alert("¡Materia actualizada!");
            }
        }

        function deleteSubject(index) {
            localData.subjects.splice(index, 1);
            saveAndSync();
        }

        // Pizarra Notas
        function renderNotes() {
            const emptyState = document.getElementById('empty-state');
            const whiteboard = document.getElementById('whiteboard');
            const floatingBtn = document.getElementById('floating-add-btn');

            whiteboard.innerHTML = "";
            if (!localData.notes || localData.notes.length === 0) {
                emptyState.style.display = 'flex';
                whiteboard.style.display = 'none';
                floatingBtn.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            whiteboard.style.display = 'grid';
            floatingBtn.style.display = 'flex';

            localData.notes.forEach((note, index) => {
                const noteDiv = document.createElement('div');
                noteDiv.className = 'postit-note';
                noteDiv.innerHTML = `
                    <div>
                        <div class="postit-title">${note.title || 'Sin título'}</div>
                        <div class="postit-body">${note.body}</div>
                    </div>
                    <div class="postit-footer">
                        <button class="aqua-btn danger" style="padding:2px 6px; font-size:10px;" onclick="deleteNote(${index})">Borrar</button>
                    </div>
                `;
                whiteboard.appendChild(noteDiv);
            });
        }

        function openNoteEditor() {
            if (localData.notes && localData.notes.length >= 20) return;
            document.getElementById('note-title-input').value = '';
            document.getElementById('note-body-input').value = '';
            document.getElementById('word-counter').innerText = '0/25 palabras';
            document.getElementById('note-modal-overlay').style.display = 'flex';
            document.getElementById('note-title-input').focus();
        }

        function checkWordLimit() {
            const textarea = document.getElementById('note-body-input');
            const words = textarea.value.trim() ? textarea.value.trim().split(/\s+/) : [];
            if (words.length > 25) {
                textarea.value = words.slice(0, 25).join(' ');
            }
            const currentWords = textarea.value.trim() ? textarea.value.trim().split(/\s+/).length : 0;
            document.getElementById('word-counter').innerText = `${currentWords}/25 palabras`;
        }

        function saveNewNote() {
            const title = document.getElementById('note-title-input').value.trim();
            const body = document.getElementById('note-body-input').value.trim();
            if (!body && !title) {
                document.getElementById('note-modal-overlay').style.display = 'none';
                return;
            }
            if (!localData.notes) localData.notes = [];
            if (localData.notes.length < 20) {
                localData.notes.push({ title: title || 'Nota', body: body || '' });
                saveAndSync();
            }
            document.getElementById('note-modal-overlay').style.display = 'none';
        }

        function deleteNote(index) {
            localData.notes.splice(index, 1);
            saveAndSync();
        }

        // Mini Buscaminas
        function initMinesweeper() {
            const board = document.getElementById('minesweeper-board');
            board.innerHTML = "";
            for (let i = 0; i < 24; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerText = '';
                cell.onclick = () => {
                    cell.classList.add('revealed');
                    cell.innerText = Math.random() > 0.8 ? '💣' : '✓';
                };
                board.appendChild(cell);
            }
        }

        function resetAllData() {
            if (confirm("¿Restablecer todo a cero?")) {
                localData = JSON.parse(JSON.stringify(defaultData));
                saveAndSync();
            }
        }

        window.onload = renderAll;
    </script>
</body>
</html>
